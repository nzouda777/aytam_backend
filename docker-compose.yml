services:
  # PHP Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - user=laravel
        - uid=1000
    container_name: laravel_app
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - laravel_network

  # Nginx Service


  webserver:
    image: nginx:alpine
    container_name: nginx_server
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/
    depends_on:
      - app
    networks:
      - laravel_network

  # MySQL Service
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: unless-stopped
    tty: true
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: yateem
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: secret
      MYSQL_USER: master
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-proot" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - dbdata:/var/lib/mysql/
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - laravel_network
  # Vite Service (dev uniquement : démarrer avec `docker compose --profile dev up`).
  # Sans lui, l'app sert les assets buildés de public/build (npm run build).
  vite:
    image: node:20-alpine
    container_name: vite_dev
    restart: unless-stopped
    profiles:
      - dev
    working_dir: /var/www/html
    ports:
      - "5173:5173"
    volumes:
      - ./:/var/www/html
      - /var/www/html/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    networks:
      - laravel_network

  # phpMyAdmin Service
  phpmyadmin:
    image: phpmyadmin:latest
    platform: linux/amd64
    container_name: yateem-pma
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 100M
      UPLOAD_MAX_SIZE: 100M
      MEMORY_LIMIT: 512M
      MAX_EXECUTION_TIME: 300
    restart: always
    ports:
      - "8080:80"
    networks:
      - laravel_network

# Docker Networks
networks:
  laravel_network:
    driver: bridge

# Volumes
volumes:
  dbdata:
    driver: local
